<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luyện tập tìm m - Đại số tuyến tính</title>
  <script>
    MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --success: #16a34a;
      --success-bg: #dcfce7;
      --error: #dc2626;
      --error-bg: #fee2e2;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 10px 25px -5px rgb(0 0 0 / 0.08), 0 4px 10px -4px rgb(0 0 0 / 0.04);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #eff6ff 0%, #f0f9ff 50%, #f8fafc 100%);
      min-height: 100vh;
      color: var(--text);
      line-height: 1.6;
      padding: 20px;
    }
    .container { max-width: 720px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 28px; }
    header h1 { font-size: 1.65rem; font-weight: 700; color: var(--primary); margin-bottom: 6px; }
    header p { color: var(--muted); font-size: 0.95rem; }
    .progress-wrap {
      background: var(--card); border-radius: 16px; padding: 16px 20px;
      box-shadow: var(--shadow); margin-bottom: 20px;
    }
    .progress-info {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px; font-size: 0.9rem; color: var(--muted);
    }
    .progress-bar { height: 10px; background: #e2e8f0; border-radius: 999px; overflow: hidden; }
    .progress-fill {
      height: 100%; background: linear-gradient(90deg, var(--primary), #3b82f6);
      border-radius: 999px; transition: width 0.4s ease;
    }
    .card {
      background: var(--card); border-radius: 20px; padding: 28px 26px;
      box-shadow: var(--shadow); margin-bottom: 20px;
    }
    .question-num {
      display: inline-block; background: #dbeafe; color: var(--primary);
      font-weight: 600; font-size: 0.85rem; padding: 4px 12px;
      border-radius: 999px; margin-bottom: 14px;
    }
    .question-text { font-size: 1.05rem; font-weight: 500; margin-bottom: 18px; }
    .options { display: flex; flex-direction: column; gap: 12px; }
    .option {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 14px 16px; border: 2px solid var(--border);
      border-radius: 14px; cursor: pointer; transition: all 0.2s ease; background: #fff;
    }
    .option:hover:not(.disabled) { border-color: #93c5fd; background: #f0f9ff; }
    .option.selected { border-color: var(--primary); background: #eff6ff; }
    .option.correct { border-color: var(--success); background: var(--success-bg); }
    .option.wrong { border-color: var(--error); background: var(--error-bg); }
    .option.disabled { cursor: not-allowed; opacity: 0.7; }
    .option input { margin-top: 3px; accent-color: var(--primary); width: 18px; height: 18px; flex-shrink: 0; }
    .option-label { flex: 1; font-size: 0.98rem; }
    .option-key { font-weight: 700; color: var(--primary); margin-right: 6px; }
    .feedback {
      margin-top: 20px; padding: 14px 16px; border-radius: 12px;
      font-size: 0.95rem; display: none; animation: fadeIn 0.3s ease;
    }
    .feedback.show { display: block; }
    .feedback.correct { background: var(--success-bg); color: #166534; border: 1px solid #86efac; }
    .feedback.wrong { background: var(--error-bg); color: #991b1b; border: 1px solid #fca5a5; }
    .actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; }
    button {
      border: none; border-radius: 12px; padding: 12px 24px;
      font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s ease;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-dark); transform: translateY(-1px); }
    .btn-primary:disabled { background: #94a3b8; cursor: not-allowed; transform: none; }
    .result-screen { text-align: center; padding: 20px 10px; }
    .result-screen h2 { font-size: 1.6rem; margin-bottom: 12px; color: var(--primary); }
    .score-circle {
      width: 140px; height: 140px; border-radius: 50%;
      background: linear-gradient(135deg, #dbeafe, #bfdbfe);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      margin: 24px auto; border: 6px solid var(--primary);
    }
    .score-circle .score { font-size: 2.4rem; font-weight: 800; color: var(--primary); line-height: 1; }
    .score-circle .label { font-size: 0.85rem; color: var(--muted); margin-top: 4px; }
    .stats { display: flex; justify-content: center; gap: 28px; margin: 20px 0 28px; flex-wrap: wrap; }
    .stat { text-align: center; }
    .stat .num { font-size: 1.5rem; font-weight: 700; color: var(--text); }
    .stat .lbl { font-size: 0.85rem; color: var(--muted); }
    .hidden { display: none !important; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 520px) {
      body { padding: 12px; }
      .card { padding: 20px 16px; }
      header h1 { font-size: 1.35rem; }
      .question-text { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Luyện tập Trắc nghiệm</h1>
      <p>Đại số tuyến tính · Hạng ma trận · Khả nghịch · Hệ phương trình</p>
    </header>

    <div class="progress-wrap" id="progressWrap">
      <div class="progress-info">
        <span id="progressText">Câu 1 / 21</span>
        <span id="attemptInfo">Lần thử: 0</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width: 0%"></div>
      </div>
    </div>

    <div class="card" id="quizCard">
      <div class="question-num" id="qNum">Câu hỏi 1</div>
      <div class="question-text" id="qText"></div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <div class="actions">
        <button class="btn-primary" id="btnNext" disabled>Kiểm tra</button>
      </div>
    </div>

    <div class="card result-screen hidden" id="resultScreen">
      <h2>Hoàn thành!</h2>
      <p style="color: var(--muted)">Bạn đã luyện xong tất cả câu hỏi.</p>
      <div class="score-circle">
        <div class="score" id="finalScore">0</div>
        <div class="label">điểm</div>
      </div>
      <div class="stats">
        <div class="stat">
          <div class="num" id="statCorrect">0</div>
          <div class="lbl">Câu đúng lần đầu</div>
        </div>
        <div class="stat">
          <div class="num" id="statTotal">21</div>
          <div class="lbl">Tổng số câu</div>
        </div>
        <div class="stat">
          <div class="num" id="statAttempts">0</div>
          <div class="lbl">Tổng lần thử</div>
        </div>
      </div>
      <button class="btn-primary" id="btnRestart" style="min-width: 180px;">Làm lại từ đầu</button>
    </div>
  </div>

  <script>
    const questions = [
      {
        id: 1,
        text: `Cho ma trận $A = \\begin{pmatrix} m & 2m \\\\ 1 & m \\end{pmatrix}$. Hạng của ma trận A bằng 2 khi`,
        options: [
          "$m \\neq 2$",
          "$m \\neq 0 \\land m \\neq 2$",
          "$m \\neq 0$",
          "$m \\neq 0 \\lor m \\neq 2$"
        ],
        answer: "b",
        hint: "Tính det(A) = m² - 2m. Hạng = 2 khi det ≠ 0 và ma trận không phải zero."
      },
      {
        id: 2,
        text: `Cho ma trận $A = \\begin{pmatrix} m^{2} & m \\\\ 1 & m \\end{pmatrix}$. Hạng của ma trận bằng 2 khi:`,
        options: [
          "$m \\neq 0 \\land m \\neq -1 \\land m \\neq 1$",
          "$m \\neq 0 \\lor m \\neq -1 \\lor m \\neq 1$",
          "$m \\neq 0 \\land m \\neq 1$",
          "$m \\neq -1 \\land m \\neq 1$"
        ],
        answer: "a",
        hint: "det(A) = m³ - m = m(m²-1). Hạng = 2 khi det ≠ 0."
      },
      {
        id: 3,
        text: `Cho ma trận $A = \\begin{pmatrix} 1 & 1 & -3 \\\\ 2 & 1 & m \\\\ 1 & m & 3 \\end{pmatrix}$. Hạng của ma trận A bằng 2 khi`,
        options: [
          "$m \\neq 0 \\lor m \\neq -5$",
          "$m = 0 \\lor m = -5$",
          "$m = 0$",
          "$m = -5$"
        ],
        answer: "b",
        hint: "Hạng = 2 khi tất cả định thức con cấp 3 bằng 0, nhưng có định thức con cấp 2 khác 0."
      },
      {
        id: 4,
        text: `Cho ma trận $A = \\begin{pmatrix} m & 5m & -m \\\\ 2m & m & 10m \\\\ -m & -2m & -3m \\end{pmatrix}$. Xác định m để hạng của ma trận A bằng 2`,
        options: [
          "$m \\neq 0$",
          "$m = 1$",
          "$m \\neq 1$",
          "$m = 0$"
        ],
        answer: "a",
        hint: "Khi m = 0 thì A là ma trận không, hạng = 0. Khi m ≠ 0 hạng = 2."
      },
      {
        id: 5,
        text: `Cho ma trận $A = \\begin{pmatrix} 1 & 1 & -3 \\\\ 2 & 1 & m \\\\ 1 & m & 3 \\end{pmatrix}$. Hạng của ma trận A bằng 3 khi:`,
        options: [
          "$m \\neq 0 \\land m \\neq 5$",
          "$m \\neq 0$",
          "$m \\neq 5$",
          "$m \\neq 0 \\lor m \\neq 5$"
        ],
        answer: "a",
        hint: "Hạng = 3 khi det(A) ≠ 0."
      },
      {
        id: 6,
        text: `Tìm m để ma trận sau không khả nghịch $A = \\begin{pmatrix} 1 & m^{2} & m \\\\ m & 1 & m^{2} \\\\ m^{2} & m & 1 \\end{pmatrix}$`,
        options: [
          "$m \\neq \\pm 1$",
          "$m = 1$",
          "$m \\neq 1$",
          "$m = \\pm 1$"
        ],
        answer: "b",
        hint: "Ma trận không khả nghịch khi det(A) = 0. Tính det và giải."
      },
      {
        id: 7,
        text: `Tìm m để ma trận sau không khả nghịch $A = \\begin{pmatrix} -1 & m & m \\\\ m & -1 & m \\\\ m & m & -1 \\end{pmatrix}$`,
        options: [
          "$m = -1$",
          "$m = -1 \\land m = \\dfrac{1}{2}$",
          "$m = \\dfrac{1}{2}$",
          "$m = -1 \\lor m = \\dfrac{1}{2}$"
        ],
        answer: "d",
        hint: "det(A) = 0 khi m = -1 hoặc m = 1/2."
      },
      {
        id: 8,
        text: `Cho ma trận $A = \\begin{pmatrix} 2m & m \\\\ 1 & m \\end{pmatrix}$. Ma trận A khả nghịch khi`,
        options: [
          "$m \\neq 0m$",
          "$m \\neq 0 \\land m \\neq \\dfrac{1}{2}$",
          "$m \\neq 0 \\lor m \\neq \\dfrac{1}{2}$",
          "$m \\neq \\dfrac{1}{2}$"
        ],
        answer: "b",
        hint: "det(A) = 2m² - m = m(2m-1) ≠ 0."
      },
      {
        id: 9,
        text: `Cho ma trận $A = \\begin{pmatrix} 2m & 3m-1 \\\\ 1 & m \\end{pmatrix}$. Tìm m để ma trận A khả nghịch khi`,
        options: [
          "$m \\neq 1 \\land m \\neq \\dfrac{1}{2}$",
          "$m \\neq 1$",
          "$m \\neq 1 \\lor m \\neq \\dfrac{1}{2}$",
          "$m \\neq \\dfrac{1}{2}$"
        ],
        answer: "a",
        hint: "det(A) = 2m² - (3m-1) = 2m² - 3m + 1 ≠ 0."
      },
      {
        id: 10,
        text: `Tìm m để ma trận A khả nghịch: $A = \\begin{pmatrix} 1 & m^{2} & m \\\\ m & 1 & m^{2} \\\\ m^{2} & m & 1 \\end{pmatrix}$`,
        options: [
          "$m = 1$",
          "$m = \\pm 1$",
          "$m \\neq 1$",
          "$m \\neq \\pm 1$"
        ],
        answer: "c",
        hint: "Khả nghịch khi det ≠ 0, tức m ≠ 1 (và kiểm tra các giá trị khác)."
      },
      {
        id: 11,
        text: `Cho ma trận $A = \\begin{pmatrix} m & 2 & 0 \\\\ 2 & m & 1 \\\\ 0 & 1 & m \\end{pmatrix}$. Tìm m để ma trận A khả nghịch`,
        options: [
          "$m \\neq 0$",
          "$m \\neq 0 \\land m \\neq \\pm \\sqrt[3]{5}$",
          "$m \\neq \\sqrt[3]{5}$",
          "$m \\neq 0$ hoặc $m \\neq \\pm \\sqrt[3]{5}$"
        ],
        answer: "b",
        hint: "Tính det(A) và tìm điều kiện det ≠ 0."
      },
      {
        id: 12,
        text: `Cho ma trận $A = \\begin{pmatrix} 1 & -2 & 2 \\\\ m & 3 & 0 \\\\ 2 & 1 & 1 \\end{pmatrix}$. Tìm m để ma trận A khả nghịch`,
        options: [
          "$m \\neq \\dfrac{9}{4}$",
          "$m = \\dfrac{9}{4}$",
          "$m = -\\dfrac{9}{4}$",
          "$m \\neq -\\dfrac{9}{4}$"
        ],
        answer: "a",
        hint: "det(A) = 0 khi m = 9/4."
      },
      {
        id: 13,
        text: `Cho ma trận $A = \\begin{pmatrix} 1 & 2 & -1 \\\\ 0 & 1 & m+2 \\\\ 0 & 1 & -5 \\end{pmatrix}$. Tìm m để ma trận A khả nghịch`,
        options: [
          "$m \\neq -3$",
          "$m \\neq 3$",
          "$m \\neq 7$",
          "$m \\neq -7$"
        ],
        answer: "d",
        hint: "det(A) = 1·(1·(-5) - (m+2)·1) = -5 - m - 2 = -m -7. det ≠ 0 ⇒ m ≠ -7."
      },
      {
        id: 14,
        text: `Cho hệ phương trình $\\begin{cases} x_1 - x_2 + 2x_3 = 3 \\\\ 2x_1 + mx_2 + 3x_3 = 1 \\\\ 3x_1 + 3x_2 + x_3 = 4 \\end{cases}$. Hệ vô nghiệm khi:`,
        options: [
          "$m \\neq -\\dfrac{4}{5}$",
          "$m = \\dfrac{4}{5}$",
          "$m \\neq \\dfrac{4}{5}$",
          "$m = -\\dfrac{4}{5}$"
        ],
        answer: "d",
        hint: "Hệ vô nghiệm khi rank(A) < rank([A|b])."
      },
      {
        id: 15,
        text: `Cho hệ phương trình $\\begin{cases} x_1 + x_2 + mx_3 = 1 \\\\ x_1 + mx_2 + x_3 = 1 \\\\ x_1 + (m+1)x_2 + (m+1)x_3 = 0 \\end{cases}$. Hệ vô nghiệm khi:`,
        options: [
          "$m \\neq \\pm 1$",
          "$m = -1$",
          "$m = 1$",
          "$m = \\pm 1$"
        ],
        answer: "b",
        hint: "Kiểm tra điều kiện rank(A) < rank([A|b]) khi m = -1."
      },
      {
        id: 16,
        text: `Cho hệ phương trình $\\begin{cases} x_1 + x_2 + mx_3 = 1 \\\\ x_1 + mx_2 + x_3 = 1 \\\\ x_1 + (m+1)x_2 + (m+1)x_3 = 0 \\end{cases}$. Hệ có vô số nghiệm khi:`,
        options: [
          "$m \\neq \\pm 1$",
          "$m = 1$",
          "$m = \\pm 1$",
          "$m = -1$"
        ],
        answer: "b",
        hint: "Hệ có vô số nghiệm khi rank(A) = rank([A|b]) < số ẩn."
      },
      {
        id: 17,
        text: `Cho hệ phương trình $\\begin{cases} x_1 + x_2 + x_3 = 3 \\\\ x_1 + mx_2 + 2x_3 = 1 \\\\ x_1 + x_2 + mx_3 = 3 \\end{cases}$. Hệ có vô số nghiệm khi:`,
        options: [
          "$m \\neq \\pm 1$",
          "$m \\neq -1$",
          "$m \\neq 1$",
          "$m = 1$"
        ],
        answer: "d",
        hint: "Khi m = 1 thì hai phương trình trùng nhau, hệ có vô số nghiệm."
      },
      {
        id: 18,
        text: `Giải hệ phương trình $\\begin{cases} -x_1 + 3x_2 + mx_3 = 1 \\\\ 4x_1 - x_2 + 4x_3 = -1 \\\\ 3x_1 + 2x_2 - x_3 = 0 \\end{cases}$. Hệ phương trình có vô số nghiệm khi`,
        options: [
          "$m \\neq -5$",
          "$m \\neq 0$",
          "$m \\neq 5$",
          "$m = -5$"
        ],
        answer: "d",
        hint: "Khi m = -5 thì rank(A) = rank([A|b]) < 3."
      },
      {
        id: 19,
        text: `Cho hệ phương trình $\\begin{cases} x_1 + x_2 + x_3 = 3 \\\\ x_1 + mx_2 + 2x_3 = 1 \\\\ x_1 + x_2 + mx_3 = 3 \\end{cases}$. Hệ có nghiệm duy nhất khi:`,
        options: [
          "$m = 1$",
          "$m \\neq \\pm 1$",
          "$m \\neq -1$",
          "$m \\neq 1$"
        ],
        answer: "d",
        hint: "Hệ có nghiệm duy nhất khi det(A) ≠ 0, tức m ≠ 1."
      },
      {
        id: 20,
        text: `Cho hệ phương trình $\\begin{cases} -x_1 + 3x_2 + mx_3 = 1 \\\\ 4x_1 - x_2 + 4x_3 = -1 \\\\ 3x_1 + 2x_2 - x_3 = 0 \\end{cases}$. Hệ có nghiệm duy nhất khi:`,
        options: [
          "$m \\neq -5$",
          "$m \\neq 5$",
          "$m = -5$",
          "$m \\neq 0$"
        ],
        answer: "a",
        hint: "Hệ có nghiệm duy nhất khi det(A) ≠ 0, tức m ≠ -5."
      },
      {
        id: 21,
        text: `Cho hệ phương trình $\\begin{cases} x_1 + x_2 + mx_3 = 1 \\\\ x_1 + mx_2 + x_3 = 1 \\\\ x_1 + (m+1)x_2 + (m+1)x_3 = 0 \\end{cases}$. Hệ có nghiệm duy nhất khi:`,
        options: [
          "$m \\neq -1$",
          "$m = \\pm 1$",
          "$m \\neq \\pm 1$",
          "$m \\neq 1$"
        ],
        answer: "c",
        hint: "Hệ có nghiệm duy nhất khi det(A) ≠ 0, tức m ≠ ±1."
      }
    ];

    let currentIndex = 0;
    let selectedAnswer = null;
    let isChecked = false;
    let totalAttempts = 0;
    let correctFirstTry = 0;
    let firstTry = true;
    const keys = ["a", "b", "c", "d"];

    const qNum = document.getElementById("qNum");
    const qText = document.getElementById("qText");
    const optionsEl = document.getElementById("options");
    const feedback = document.getElementById("feedback");
    const btnNext = document.getElementById("btnNext");
    const progressText = document.getElementById("progressText");
    const progressFill = document.getElementById("progressFill");
    const attemptInfo = document.getElementById("attemptInfo");
    const quizCard = document.getElementById("quizCard");
    const resultScreen = document.getElementById("resultScreen");
    const progressWrap = document.getElementById("progressWrap");

    function typeset() {
      if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise([qText, optionsEl]).catch(() => {});
      }
    }

    function loadQuestion() {
      const q = questions[currentIndex];
      selectedAnswer = null;
      isChecked = false;
      firstTry = true;

      qNum.textContent = `Câu hỏi ${q.id}`;
      qText.innerHTML = q.text;

      optionsEl.innerHTML = "";
      q.options.forEach((opt, i) => {
        const div = document.createElement("div");
        div.className = "option";
        div.dataset.key = keys[i];
        div.innerHTML = `
          <input type="radio" name="answer" id="opt${i}" value="${keys[i]}" />
          <label class="option-label" for="opt${i}">
            <span class="option-key">${keys[i].toUpperCase()}.</span> ${opt}
          </label>
        `;
        div.addEventListener("click", () => selectOption(div, keys[i]));
        optionsEl.appendChild(div);
      });

      feedback.className = "feedback";
      feedback.textContent = "";
      btnNext.textContent = "Kiểm tra";
      btnNext.disabled = true;

      const pct = (currentIndex / questions.length) * 100;
      progressFill.style.width = pct + "%";
      progressText.textContent = `Câu ${currentIndex + 1} / ${questions.length}`;
      attemptInfo.textContent = `Lần thử: ${totalAttempts}`;

      typeset();
    }

    function selectOption(el, key) {
      if (isChecked && key !== questions[currentIndex].answer) return;
      document.querySelectorAll(".option").forEach(o => {
        if (!o.classList.contains("correct")) o.classList.remove("selected", "wrong");
      });
      el.classList.add("selected");
      selectedAnswer = key;
      document.getElementById(el.querySelector("input").id).checked = true;
      btnNext.disabled = false;
    }

    function checkAnswer() {
      const q = questions[currentIndex];
      totalAttempts++;
      attemptInfo.textContent = `Lần thử: ${totalAttempts}`;

      if (selectedAnswer === q.answer) {
        isChecked = true;
        document.querySelectorAll(".option").forEach(o => {
          o.classList.add("disabled");
          if (o.dataset.key === q.answer) {
            o.classList.remove("selected", "wrong");
            o.classList.add("correct");
          }
        });
        feedback.className = "feedback show correct";
        feedback.innerHTML = firstTry
          ? "✅ Chính xác! Bạn đã chọn đúng ngay lần đầu."
          : "✅ Đúng rồi! Tiếp tục nhé.";
        if (firstTry) correctFirstTry++;
        btnNext.textContent = currentIndex === questions.length - 1 ? "Xem kết quả" : "Câu tiếp theo →";
        btnNext.disabled = false;
        btnNext.onclick = nextQuestion;
      } else {
        firstTry = false;
        isChecked = true;
        document.querySelectorAll(".option").forEach(o => {
          if (o.dataset.key === selectedAnswer) {
            o.classList.remove("selected");
            o.classList.add("wrong");
          }
        });
        feedback.className = "feedback show wrong";
        feedback.innerHTML = `❌ Sai rồi! Gợi ý: ${q.hint}<br><strong>Hãy chọn lại đáp án đúng để tiếp tục.</strong>`;
        btnNext.textContent = "Chọn lại";
        btnNext.disabled = true;
        setTimeout(() => {
          isChecked = false;
          document.querySelectorAll(".option").forEach(o => {
            if (!o.classList.contains("correct")) o.classList.remove("disabled", "wrong");
          });
        }, 600);
      }
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex >= questions.length) {
        showResult();
      } else {
        btnNext.onclick = checkAnswer;
        loadQuestion();
      }
    }

    function showResult() {
      quizCard.classList.add("hidden");
      progressWrap.classList.add("hidden");
      resultScreen.classList.remove("hidden");
      const score = Math.round((correctFirstTry / questions.length) * 100);
      document.getElementById("finalScore").textContent = score;
      document.getElementById("statCorrect").textContent = correctFirstTry;
      document.getElementById("statTotal").textContent = questions.length;
      document.getElementById("statAttempts").textContent = totalAttempts;
    }

    function restart() {
      currentIndex = 0;
      totalAttempts = 0;
      correctFirstTry = 0;
      resultScreen.classList.add("hidden");
      quizCard.classList.remove("hidden");
      progressWrap.classList.remove("hidden");
      btnNext.onclick = checkAnswer;
      loadQuestion();
    }

    btnNext.onclick = checkAnswer;
    document.getElementById("btnRestart").onclick = restart;
    loadQuestion();
  </script>
</body>
</html>
