<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luyện tập ProList - Danh sách liên kết</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --success: #16a34a;
      --success-bg: #dcfce7;
      --error: #dc2626;
      --error-bg: #fee2e2;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 10px 25px -5px rgb(0 0 0 / 0.08), 0 4px 10px -4px rgb(0 0 0 / 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #eff6ff 0%, #f0f9ff 50%, #f8fafc 100%);
      min-height: 100vh;
      color: var(--text);
      line-height: 1.6;
      padding: 20px;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    header h1 {
      font-size: 1.65rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 6px;
    }

    header p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .progress-wrap {
      background: var(--card);
      border-radius: 16px;
      padding: 16px 20px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .progress-bar {
      height: 10px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), #3b82f6);
      border-radius: 999px;
      transition: width 0.4s ease;
    }

    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 28px 26px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }

    .question-num {
      display: inline-block;
      background: #dbeafe;
      color: var(--primary);
      font-weight: 600;
      font-size: 0.85rem;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    .question-text {
      font-size: 1.05rem;
      font-weight: 500;
      margin-bottom: 18px;
      white-space: pre-line;
    }

    .code-block {
      background: #1e293b;
      color: #e2e8f0;
      font-family: "Consolas", "Courier New", monospace;
      font-size: 0.82rem;
      line-height: 1.45;
      padding: 14px 16px;
      border-radius: 12px;
      margin: 12px 0 18px;
      overflow-x: auto;
      white-space: pre;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 16px;
      border: 2px solid var(--border);
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      background: #fff;
    }

    .option:hover:not(.disabled) {
      border-color: #93c5fd;
      background: #f0f9ff;
    }

    .option.selected {
      border-color: var(--primary);
      background: #eff6ff;
    }

    .option.correct {
      border-color: var(--success);
      background: var(--success-bg);
    }

    .option.wrong {
      border-color: var(--error);
      background: var(--error-bg);
    }

    .option.disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .option input {
      margin-top: 3px;
      accent-color: var(--primary);
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .option-label {
      flex: 1;
      font-size: 0.98rem;
    }

    .option-key {
      font-weight: 700;
      color: var(--primary);
      margin-right: 6px;
    }

    .feedback {
      margin-top: 20px;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .feedback.show {
      display: block;
    }

    .feedback.correct {
      background: var(--success-bg);
      color: #166534;
      border: 1px solid #86efac;
    }

    .feedback.wrong {
      background: var(--error-bg);
      color: #991b1b;
      border: 1px solid #fca5a5;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 24px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .btn-primary:disabled {
      background: #94a3b8;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: #e2e8f0;
      color: var(--text);
    }

    .btn-secondary:hover {
      background: #cbd5e1;
    }

    .result-screen {
      text-align: center;
      padding: 20px 10px;
    }

    .result-screen h2 {
      font-size: 1.6rem;
      margin-bottom: 12px;
      color: var(--primary);
    }

    .score-circle {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: linear-gradient(135deg, #dbeafe, #bfdbfe);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 24px auto;
      border: 6px solid var(--primary);
    }

    .score-circle .score {
      font-size: 2.4rem;
      font-weight: 800;
      color: var(--primary);
      line-height: 1;
    }

    .score-circle .label {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 28px;
      margin: 20px 0 28px;
      flex-wrap: wrap;
    }

    .stat {
      text-align: center;
    }

    .stat .num {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
    }

    .stat .lbl {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .hidden {
      display: none !important;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 520px) {
      body { padding: 12px; }
      .card { padding: 20px 16px; }
      header h1 { font-size: 1.35rem; }
      .question-text { font-size: 1rem; }
      .code-block { font-size: 0.75rem; padding: 12px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Luyện tập Trắc nghiệm</h1>
      <p>Danh sách liên kết · Chọn đúng mới được qua câu tiếp theo</p>
    </header>

    <div class="progress-wrap" id="progressWrap">
      <div class="progress-info">
        <span id="progressText">Câu 1 / 12</span>
        <span id="attemptInfo">Lần thử: 0</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width: 0%"></div>
      </div>
    </div>

    <div class="card" id="quizCard">
      <div class="question-num" id="qNum">Câu hỏi 1</div>
      <div class="question-text" id="qText"></div>
      <div class="code-block" id="codeBlock" style="display:none;"></div>

      <div class="options" id="options"></div>

      <div class="feedback" id="feedback"></div>

      <div class="actions">
        <button class="btn-primary" id="btnNext" disabled>Kiểm tra</button>
      </div>
    </div>

    <div class="card result-screen hidden" id="resultScreen">
      <h2>Hoàn thành!</h2>
      <p style="color: var(--muted)">Bạn đã luyện xong tất cả câu hỏi.</p>

      <div class="score-circle">
        <div class="score" id="finalScore">0</div>
        <div class="label">điểm</div>
      </div>

      <div class="stats">
        <div class="stat">
          <div class="num" id="statCorrect">0</div>
          <div class="lbl">Câu đúng lần đầu</div>
        </div>
        <div class="stat">
          <div class="num" id="statTotal">12</div>
          <div class="lbl">Tổng số câu</div>
        </div>
        <div class="stat">
          <div class="num" id="statAttempts">0</div>
          <div class="lbl">Tổng lần thử</div>
        </div>
      </div>

      <button class="btn-primary" id="btnRestart" style="min-width: 180px;">Làm lại từ đầu</button>
    </div>
  </div>

  <script>
    const questions = [
      {
        id: 1,
        text: "Cho trước đoạn chương trình sau. Hàm ProList cài đặt thao tác nào trong danh sách liên kết kép?",
        code: `void ProList(List &l, Node* p)
{
    if (l.pHead==NULL)
    {
        l.pHead = p;
        l.pTail = l.pHead;
    }
    else
    {
        l.pTail->pNext = p;
        p->pPrev = l.pTail;
        l.pTail = p;
    }
}`,
        options: [
          "Thêm phần tử vào cuối danh sách.",
          "Thêm phần tử vào đầu danh sách.",
          "Tìm phần tử trong danh sách.",
          "Xóa phần tử ở cuối danh sách."
        ],
        answer: "a",
        hint: "Hàm gắn node p vào sau pTail và cập nhật pTail = p → đây là thao tác thêm vào cuối."
      },
      {
        id: 2,
        text: "Cho trước đoạn chương trình sau. Hàm ProList cài đặt thao tác nào trong danh sách liên kết đơn?",
        code: `void ProList(List &l, Node* p)
{
    if (l.pHead==NULL)
    {
        l.pHead = p;
        l.pTail = l.pHead;
    }
    else
    {
        l.pTail->pNext = p;
        l.pTail = p;
    }
}`,
        options: [
          "Thêm phần tử vào đầu danh sách.",
          "Xóa phần tử ở cuối danh sách.",
          "Thêm phần tử vào cuối danh sách.",
          "Xóa phần tử ở đầu danh sách."
        ],
        answer: "c",
        hint: "Hàm gắn p vào sau pTail rồi cập nhật pTail = p → thêm vào cuối danh sách liên kết đơn."
      },
      {
        id: 3,
        text: "Cho trước đoạn chương trình sau. Hàm ProList cài đặt thao tác nào trong danh sách liên kết kép?",
        code: `void ProList(List &l, Node* p)
{
    if (l.pHead==NULL)
    {
        l.pHead = p;
        l.pTail = l.pHead;
    }
    else
    {
        p->pNext = l.pHead;
        l.pHead->pPrev = p;
        l.pHead = p;
    }
}`,
        options: [
          "Xóa phần tử ở cuối danh sách.",
          "Xóa phần tử ở đầu danh sách.",
          "Tìm phần tử trong danh sách.",
          "Thêm phần tử vào đầu danh sách."
        ],
        answer: "d",
        hint: "Hàm gắn p trước pHead và cập nhật pHead = p → thêm vào đầu danh sách liên kết kép."
      },
      {
        id: 4,
        text: "Cho trước đoạn chương trình sau. Hàm ProList cài đặt thao tác nào trong danh sách liên kết đơn?",
        code: `void ProList(List &l, Node* p)
{
    if (l.pHead==NULL)
    {
        l.pHead = p;
        l.pTail = l.pHead;
    }
    else
    {
        p->pNext = l.pHead;
        l.pHead = p;
    }
}`,
        options: [
          "Xóa phần tử ở cuối danh sách.",
          "Thêm phần tử vào cuối danh sách.",
          "Thêm phần tử vào đầu danh sách.",
          "Xóa phần tử ở đầu danh sách."
        ],
        answer: "c",
        hint: "Hàm gắn p trước pHead rồi cập nhật pHead = p → thêm vào đầu danh sách liên kết đơn."
      },
      {
        id: 5,
        text: "Cho trước đoạn chương trình sau. Hàm ProList cài đặt thao tác nào trong danh sách liên kết kép?",
        code: `void ProList(List &l, Node* q, Node* p)
{
    Node* t = q->pPrev;
    if (q!=NULL)
    {
        p->pNext = q;
        p->pPrev = t;
        q->pPrev = p;
        if(t!=NULL)
            t->pNext = p;
        if(q == l.pHead)
            l.pHead = p;
    }
}`,
        options: [
          "Thêm phần tử vào trước phần tử q.",
          "Thêm phần tử vào sau phần tử p.",
          "Thêm phần tử vào trước phần tử p.",
          "Thêm phần tử vào sau phần tử q."
        ],
        answer: "a",
        hint: "Hàm chèn node p vào vị trí ngay trước node q (cập nhật cả pPrev và pNext)."
      },
      {
        id: 6,
        text: "Cho trước đoạn chương trình sau. Hàm ProList cài đặt thao tác nào trong danh sách liên kết kép?",
        code: `void ProList(List &l, Node* q, Node* p)
{
    Node* t = q->pNext;
    if (q!=NULL)
    {
        p->pNext = t;
        p->pPrev = q;
        q->pNext = p;
        if(t!=NULL)
            t->pPrev = p;
        if(q == l.pTail)
            l.pTail = p;
    }
}`,
        options: [
          "Thêm phần tử vào sau phần tử p.",
          "Thêm phần tử vào đầu danh sách.",
          "Thêm phần tử vào cuối danh sách.",
          "Thêm phần tử vào sau phần tử q."
        ],
        answer: "d",
        hint: "Hàm chèn node p vào vị trí ngay sau node q và cập nhật pTail nếu cần."
      },
      {
        id: 7,
        text: "Cho trước đoạn chương trình sau. Hỏi hàm ProList thực hiện công việc gì trong danh sách liên kết đơn?",
        code: `typedef struct Node
{
    int Info;
    Node* pNext;
}Node;
typedef struct List
{
    Node* pHead;
    Node* pTail;
}List;

void ProList(List &l)
{
    Node *p;
    p = l.pHead;
    while(p!=NULL)
    {
        if (p->Info>=0)
            print("%d",p->Info);
        p = p->pNext;
    }
}`,
        options: [
          "In trường Info của các phần tử có giá trị không âm ra màn hình.",
          "In trường Info của các phần tử ra màn hình.",
          "Không thực hiện công việc gì.",
          "Tính tổng giá trị Info của các phần tử."
        ],
        answer: "a",
        hint: "Hàm duyệt danh sách và chỉ in những phần tử có Info >= 0."
      },
      {
        id: 8,
        text: "Cho trước đoạn chương trình sau. Hỏi hàm ProList thực hiện công việc gì trong danh sách liên kết đơn?",
        code: `typedef struct Node
{
    int Info;
    Node* pNext;
}Node;
typedef struct List
{
    Node* pHead;
    Node* pTail;
}List;

int ProList(List &l)
{
    Node *p;
    int a=0;
    p = l.pHead;
    while(p!=NULL)
    {
        a++;
        p = p->pNext;
    }
    return a;
}`,
        options: [
          "Đếm số lượng các phần tử.",
          "In giá trị Info của các phần tử ra màn hình.",
          "Tính tổng giá trị Info của các phần tử.",
          "Duyệt các phần tử trong danh sách."
        ],
        answer: "a",
        hint: "Biến a tăng 1 mỗi lần gặp một node → hàm trả về số lượng phần tử."
      },
      {
        id: 9,
        text: "Cho trước đoạn chương trình sau. Hàm ProList thực hiện thao tác nào trong danh sách liên kết đơn?",
        code: `typedef struct Node
{
    int Info;
    Node* pNext;
}Node;
typedef struct List
{
    Node* pHead;
    Node* pTail;
}List;

void ProList(List &l)
{
    Node *p;
    p = l.pHead;
    while(p!=NULL)
    {
        p = p->pNext;
    }
}`,
        options: [
          "Không thực hiện công việc gì.",
          "Tính tổng giá trị Info của các phần tử.",
          "In trường Info của các phần tử có giá trị không âm ra màn hình.",
          "In trường Info của các phần tử ra màn hình."
        ],
        answer: "a",
        hint: "Hàm chỉ duyệt qua các node mà không in, không tính toán, không thay đổi gì → không thực hiện công việc hữu ích."

      {
        id: 10,
        text: "Cho trước đoạn chương trình sau. Hàm ProList cài đặt thao tác nào trong danh sách liên kết đơn?",
        code: `Data ProList(List &l)
{
    Node *p;

    {
        p = l.pHead;

        l.pHead = l.pHead->pNext;

}`,
        options: [
          "Tìm phần tử trong danh sách.",
          "Xóa phần tử ở đầu danh sách.",
          "Xóa phần tử ở cuối danh sách.",
          "Thêm phần tử vào đầu danh sách."
        ],
        answer: "b",
        hint: "Hàm lấy node đầu, lưu giá trị, cập nhật pHead = pHead->pNext rồi giải phóng node cũ → xóa đầu danh sách."
      },
      {
        id: 11,
        text: "Cho trước đoạn chương trình sau. Hàm ProList cài đặt thao tác nào trong danh sách liên kết đơn?",
        code: `Node* ProList(List &l, Data k)

}`,
        options: [

      {

        text: "Cho trước đoạn chương trình sau. Trong danh sách liên kết đơn, hàm ProList thực hiện công việc gì?",

        options: [

          "Duyệt các phần tử trong danh sách.",

        hint: "Biến a cộng dồn p->Info của mọi node → hàm trả về tổng giá trị Info."

    ];

    let currentIndex = 0;
    let selectedAnswer = null;
    let isChecked = false;
    let totalAttempts = 0;
    let correctFirstTry = 0;
    let firstTry = true;

    const keys = ["a", "b", "c", "d"];

    const qNum = document.getElementById("qNum");
    const qText = document.getElementById("qText");
    const codeBlock = document.getElementById("codeBlock");
    const optionsEl = document.getElementById("options");
    const feedback = document.getElementById("feedback");
    const btnNext = document.getElementById("btnNext");
    const progressText = document.getElementById("progressText");
    const progressFill = document.getElementById("progressFill");
    const attemptInfo = document.getElementById("attemptInfo");
    const quizCard = document.getElementById("quizCard");
    const resultScreen = document.getElementById("resultScreen");
    const progressWrap = document.getElementById("progressWrap");

    function loadQuestion() {
      const q = questions[currentIndex];
      selectedAnswer = null;
      isChecked = false;
      firstTry = true;

      qNum.textContent = `Câu hỏi ${q.id}`;
      qText.textContent = q.text;

      if (q.code) {
        codeBlock.textContent = q.code;
        codeBlock.style.display = "block";
      } else {
        codeBlock.style.display = "none";
      }

      optionsEl.innerHTML = "";
      q.options.forEach((opt, i) => {
        const div = document.createElement("div");
        div.className = "option";
        div.dataset.key = keys[i];
        div.innerHTML = `
          <input type="radio" name="answer" id="opt${i}" value="${keys[i]}" />
          <label class="option-label" for="opt${i}">
            <span class="option-key">${keys[i].toUpperCase()}.</span> ${opt}
          </label>
        `;
        div.addEventListener("click", () => selectOption(div, keys[i]));
        optionsEl.appendChild(div);
      });

      feedback.className = "feedback";
      feedback.textContent = "";
      btnNext.textContent = "Kiểm tra";
      btnNext.disabled = true;

      const pct = (currentIndex / questions.length) * 100;
      progressFill.style.width = pct + "%";
      progressText.textContent = `Câu ${currentIndex + 1} / ${questions.length}`;
      attemptInfo.textContent = `Lần thử: ${totalAttempts}`;
    }

    function selectOption(el, key) {
      if (isChecked && key !== questions[currentIndex].answer) return;

      document.querySelectorAll(".option").forEach(o => {
        if (!o.classList.contains("correct")) {
          o.classList.remove("selected", "wrong");
        }
      });

      el.classList.add("selected");
      selectedAnswer = key;
      document.getElementById(el.querySelector("input").id).checked = true;
      btnNext.disabled = false;
    }

    function checkAnswer() {
      const q = questions[currentIndex];
      totalAttempts++;
      attemptInfo.textContent = `Lần thử: ${totalAttempts}`;

      if (selectedAnswer === q.answer) {
        isChecked = true;
        document.querySelectorAll(".option").forEach(o => {
          o.classList.add("disabled");
          if (o.dataset.key === q.answer) {
            o.classList.remove("selected", "wrong");
            o.classList.add("correct");
          }
        });

        feedback.className = "feedback show correct";
        feedback.innerHTML = firstTry
          ? "✅ Chính xác! Bạn đã chọn đúng ngay lần đầu."
          : "✅ Đúng rồi! Tiếp tục nhé.";

        if (firstTry) correctFirstTry++;

        btnNext.textContent = currentIndex === questions.length - 1 ? "Xem kết quả" : "Câu tiếp theo →";
        btnNext.disabled = false;
        btnNext.onclick = nextQuestion;
      } else {
        firstTry = false;
        isChecked = true;

        document.querySelectorAll(".option").forEach(o => {
          if (o.dataset.key === selectedAnswer) {
            o.classList.remove("selected");
            o.classList.add("wrong");
          }
        });

        feedback.className = "feedback show wrong";
        feedback.innerHTML = `❌ Sai rồi! Gợi ý: ${q.hint}<br><strong>Hãy chọn lại đáp án đúng để tiếp tục.</strong>`;

        btnNext.textContent = "Chọn lại";
        btnNext.disabled = true;

        setTimeout(() => {
          isChecked = false;
          document.querySelectorAll(".option").forEach(o => {
            if (!o.classList.contains("correct")) {
              o.classList.remove("disabled", "wrong");
            }
          });
        }, 600);
      }
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex >= questions.length) {
        showResult();
      } else {
        btnNext.onclick = checkAnswer;
        loadQuestion();
      }
    }

    function showResult() {
      quizCard.classList.add("hidden");
      progressWrap.classList.add("hidden");
      resultScreen.classList.remove("hidden");

      const score = Math.round((correctFirstTry / questions.length) * 100);
      document.getElementById("finalScore").textContent = score;
      document.getElementById("statCorrect").textContent = correctFirstTry;
      document.getElementById("statTotal").textContent = questions.length;
      document.getElementById("statAttempts").textContent = totalAttempts;
    }

    function restart() {
      currentIndex = 0;
      totalAttempts = 0;
      correctFirstTry = 0;
      resultScreen.classList.add("hidden");
      quizCard.classList.remove("hidden");
      progressWrap.classList.remove("hidden");
      btnNext.onclick = checkAnswer;
      loadQuestion();
    }

    btnNext.onclick = checkAnswer;
    document.getElementById("btnRestart").onclick = restart;
    loadQuestion();
  </script>
</body>
</html>
