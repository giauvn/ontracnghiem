<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luyện tập Trắc nghiệm - Thuật toán Sắp xếp</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --success: #16a34a;
      --success-bg: #dcfce7;
      --error: #dc2626;
      --error-bg: #fee2e2;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 10px 25px -5px rgb(0 0 0 / 0.08), 0 4px 10px -4px rgb(0 0 0 / 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #eff6ff 0%, #f0f9ff 50%, #f8fafc 100%);
      min-height: 100vh;
      color: var(--text);
      line-height: 1.6;
      padding: 20px;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    header h1 {
      font-size: 1.65rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 6px;
    }

    header p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .progress-wrap {
      background: var(--card);
      border-radius: 16px;
      padding: 16px 20px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .progress-bar {
      height: 10px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), #3b82f6);
      border-radius: 999px;
      transition: width 0.4s ease;
    }

    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 28px 26px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }

    .question-num {
      display: inline-block;
      background: #dbeafe;
      color: var(--primary);
      font-weight: 600;
      font-size: 0.85rem;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    .question-text {
      font-size: 1.05rem;
      font-weight: 500;
      margin-bottom: 22px;
      white-space: pre-line;
      font-family: "Consolas", "Courier New", monospace;
      background: #f1f5f9;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow-x: auto;
      line-height: 1.45;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 16px;
      border: 2px solid var(--border);
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      background: #fff;
    }

    .option:hover:not(.disabled) {
      border-color: #93c5fd;
      background: #f0f9ff;
    }

    .option.selected {
      border-color: var(--primary);
      background: #eff6ff;
    }

    .option.correct {
      border-color: var(--success);
      background: var(--success-bg);
    }

    .option.wrong {
      border-color: var(--error);
      background: var(--error-bg);
    }

    .option.disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .option input {
      margin-top: 3px;
      accent-color: var(--primary);
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .option-label {
      flex: 1;
      font-size: 0.98rem;
    }

    .option-key {
      font-weight: 700;
      color: var(--primary);
      margin-right: 6px;
    }

    .feedback {
      margin-top: 20px;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .feedback.show {
      display: block;
    }

    .feedback.correct {
      background: var(--success-bg);
      color: #166534;
      border: 1px solid #86efac;
    }

    .feedback.wrong {
      background: var(--error-bg);
      color: #991b1b;
      border: 1px solid #fca5a5;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 24px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .btn-primary:disabled {
      background: #94a3b8;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: #e2e8f0;
      color: var(--text);
    }

    .btn-secondary:hover {
      background: #cbd5e1;
    }

    /* Result screen */
    .result-screen {
      text-align: center;
      padding: 20px 10px;
    }

    .result-screen h2 {
      font-size: 1.6rem;
      margin-bottom: 12px;
      color: var(--primary);
    }

    .score-circle {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: linear-gradient(135deg, #dbeafe, #bfdbfe);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 24px auto;
      border: 6px solid var(--primary);
    }

    .score-circle .score {
      font-size: 2.4rem;
      font-weight: 800;
      color: var(--primary);
      line-height: 1;
    }

    .score-circle .label {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 28px;
      margin: 20px 0 28px;
      flex-wrap: wrap;
    }

    .stat {
      text-align: center;
    }

    .stat .num {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
    }

    .stat .lbl {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .hidden {
      display: none !important;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 520px) {
      body { padding: 12px; }
      .card { padding: 20px 16px; }
      header h1 { font-size: 1.35rem; }
      .question-text { font-size: 0.92rem; padding: 12px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Luyện tập Trắc nghiệm</h1>
      <p>Thuật toán Sắp xếp · Chọn đúng mới được qua câu tiếp theo</p>
    </header>

    <!-- Progress -->
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-info">
        <span id="progressText">Câu 1 / 8</span>
        <span id="attemptInfo">Lần thử: 0</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width: 0%"></div>
      </div>
    </div>

    <!-- Quiz Card -->
    <div class="card" id="quizCard">
      <div class="question-num" id="qNum">Câu hỏi 1</div>
      <div class="question-text" id="qText"></div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <div class="actions">
        <button class="btn-primary" id="btnNext" disabled>Kiểm tra</button>
      </div>
    </div>

    <!-- Result Screen -->
    <div class="card result-screen hidden" id="resultScreen">
      <h2>Hoàn thành!</h2>
      <p style="color: var(--muted)">Bạn đã luyện xong tất cả câu hỏi.</p>
      <div class="score-circle">
        <div class="score" id="finalScore">0</div>
        <div class="label">điểm</div>
      </div>
      <div class="stats">
        <div class="stat">
          <div class="num" id="statCorrect">0</div>
          <div class="lbl">Câu đúng lần đầu</div>
        </div>
        <div class="stat">
          <div class="num" id="statTotal">8</div>
          <div class="lbl">Tổng số câu</div>
        </div>
        <div class="stat">
          <div class="num" id="statAttempts">0</div>
          <div class="lbl">Tổng lần thử</div>
        </div>
      </div>
      <button class="btn-primary" id="btnRestart" style="min-width: 180px;">Làm lại từ đầu</button>
    </div>
  </div>

  <script>
    const questions = [
      {
        id: 1,
        text: `Cho hàm sắp xếp:

void ProSort (int a[], int N)
{
  int min, i, j;
  for (i=1; i<N; i++)
  {
    min = i;
    for (j=i+1; j<=N; j++)
      if (a[j]<a[min])
        min = j;
    Swap(a[min], a[i]);
  }
}

Hàm trên cài đặt giải thuật sắp xếp nào?`,
        options: [
          "Chèn trực tiếp (Insertion Sort).",
          "Chọn trực tiếp (Selection Sort).",
          "Nổi bọt (Bubble Sort).",
          "Đổi chỗ trực tiếp (Interchange Sort)."
        ],
        answer: "b",
        hint: "Hàm tìm phần tử nhỏ nhất trong đoạn chưa sắp và đưa về vị trí đúng → Selection Sort."
      },
      {
        id: 2,
        text: `Cho hàm sắp xếp:

void ProSort(int a[], int N)
{
  int i, j;
  for (i=1; i<N; i++)
    for (j=N; j>i; j--)
      if(a[j]<a[j-1])
        Swap(a[j], a[j-1]);
}

Hàm trên cài đặt phương pháp sắp xếp nào?`,
        options: [
          "Nổi bọt (Bubble Sort)",
          "Chọn trực tiếp (Selection Sort)",
          "Chèn trực tiếp (Insertion Sort)",
          "Đổi chỗ trực tiếp (Interchange Sort)"
        ],
        answer: "a",
        hint: "So sánh và đổi chỗ các cặp phần tử liền kề từ cuối lên → Bubble Sort."
      },
      {
        id: 3,
        text: `typedef struct Node
{
  int Info;
  Node* pNext;
}Node;
typedef struct List
{
  Node* pHead;
  Node* pTail;
}List;

void ProSort(List &l)
{
  Node *p, *q;
  p = l.pHead;
  while(p!=NULL)
  {
    q = p->pNext;
    while(q!=NULL)
    {
      if (p->Info > q->Info)
        Swap(p->Info,q->Info);
      q = q->pNext;
    }
    p = p->pNext;
  }
}

Hàm ProSort sắp xếp trên danh sách liên kết đơn dựa trên giải thuật sắp xếp:`,
        options: [
          "Chọn trực tiếp (Selection Sort).",
          "Đổi chỗ trực tiếp (Interchange Sort).",
          "Chèn trực tiếp (Insertion Sort).",
          "Nổi bọt (Bubble Sort)."
        ],
        answer: "b",
        hint: "So sánh từng cặp p với mọi q phía sau và đổi chỗ ngay khi sai thứ tự → Interchange Sort."
      },
      {
        id: 4,
        text: `void ProSort(int a[], int N)
{
  int i, j;
  for(i=1; i<N; i++)
    for (j =i+1; j<=N; j++)
      if(a[j] < a[i])
        Swap(a[i],a[j]);
}

Hàm trên cài đặt phương pháp sắp xếp nào?`,
        options: [
          "Nổi bọt (Bubble Sort)",
          "Chọn trực tiếp (Selection Sort)",
          "Đổi chỗ trực tiếp (Interchange Sort)",
          "Chèn trực tiếp (Insertion Sort)"
        ],
        answer: "c",
        hint: "Với mỗi i, so sánh a[i] với tất cả phần tử phía sau và đổi chỗ ngay → Interchange Sort."
      },
      {
        id: 5,
        text: `Cho hàm sắp xếp:

void ProSort(int a[], int N)
{
  int pos, i, x;
  for(i=2; i<=N; i++)
  {
    x = a[i];
    pos = i-1;
    while ((pos>=0) && (a[pos] > x))
    {
      a[pos+1]=a[pos];
      pos--;
    }
    a[pos+1] = x;
  }
}

Hàm trên cài đặt phương pháp sắp xếp nào?`,
        options: [
          "Đổi chỗ trực tiếp (Interchange Sort)",
          "Chèn trực tiếp (Insertion Sort)",
          "Chọn trực tiếp (Selection Sort)",
          "Nổi bọt (Bubble Sort)"
        ],
        answer: "b",
        hint: "Lấy phần tử x rồi dịch các phần tử lớn hơn sang phải để chèn x vào đúng vị trí → Insertion Sort."
      },
      {
        id: 6,
        text: `void ProSort(List &l)
{
  Node *p, *q, *pmin;
  p = l.pHead;
  while(p!=NULL)
  {
    pmin = p;
    q = p->pNext;
    while(q!=NULL)
    {
      if (pmin->Info > q->Info)
        pmin = q;
      q = q->pNext;
    }
    if (pmin != p)
      Swap(pmin->Info, p->Info);
    p = p->pNext;
  }
}

Hàm ProSort sắp xếp trên danh sách liên kết đơn dựa trên giải thuật sắp xếp:`,
        options: [
          "Chọn trực tiếp (Selection Sort).",
          "Chèn trực tiếp (Insertion Sort).",
          "Nổi bọt (Bubble Sort).",
          "Đổi chỗ trực tiếp (Interchange Sort)."
        ],
        answer: "a",
        hint: "Mỗi vòng tìm phần tử nhỏ nhất (pmin) rồi mới đổi chỗ một lần → Selection Sort."
      },
      {
        id: 7,
        text: `Cho hàm sắp xếp:

void ProSort(int a[], int N)
{
  int i, j;
  for(i=1; i<=N; i++)
    for (j=i+1; j<=N; j++)
      if(a[j] < a[i])
        Swap(a[j], a[i]);
}

Hàm trên cài đặt phương pháp sắp xếp nào?`,
        options: [
          "Đổi chỗ trực tiếp (Interchange Sort)",
          "Chọn trực tiếp (Selection Sort)",
          "Chèn trực tiếp (Insertion Sort)",
          "Nổi bọt (Bubble Sort)"
        ],
        answer: "a",
        hint: "So sánh a[i] với mọi phần tử phía sau và đổi chỗ ngay khi cần → Interchange Sort."
      },
      {
        id: 8,
        text: `Cho trước đoạn chương trình sau:

typedef struct Node
{
  int Info;
  Node* pNext;
}Node;
typedef struct List
{
  Node* pHead;
  Node* pTail;
}List;

void ProSort(List &l)
{
  Node *p, *q, *pmin;
  p = l.pHead;
  while(p!=NULL)
  {
    pmin = p;
    q = p->pNext;
    while(q!=NULL)
    {
      if (pmin->Info > q->Info)
        pmin = q;
      q = q->pNext;
    }
    if (pmin != p)
      Swap(pmin->Info, p->Info);
    p = p->pNext;
  }
}

Hàm ProSort sắp xếp trên danh sách liên kết đơn dựa trên giải thuật sắp xếp:`,
        options: [
          "Chọn trực tiếp (Selection Sort).",
          "Chèn trực tiếp (Insertion Sort).",
          "Đổi chỗ trực tiếp (Interchange Sort).",
          "Nổi bọt (Bubble Sort)."
        ],
        answer: "a",
        hint: "Tìm phần tử nhỏ nhất rồi mới đổi chỗ một lần → Selection Sort."
      }
    ];

    // State
    let currentIndex = 0;
    let selectedAnswer = null;
    let isChecked = false;
    let totalAttempts = 0;
    let correctFirstTry = 0;
    let firstTry = true;

    const keys = ["a", "b", "c", "d"];

    // DOM
    const qNum = document.getElementById("qNum");
    const qText = document.getElementById("qText");
    const optionsEl = document.getElementById("options");
    const feedback = document.getElementById("feedback");
    const btnNext = document.getElementById("btnNext");
    const progressText = document.getElementById("progressText");
    const progressFill = document.getElementById("progressFill");
    const attemptInfo = document.getElementById("attemptInfo");
    const quizCard = document.getElementById("quizCard");
    const resultScreen = document.getElementById("resultScreen");
    const progressWrap = document.getElementById("progressWrap");

    function loadQuestion() {
      const q = questions[currentIndex];
      selectedAnswer = null;
      isChecked = false;
      firstTry = true;

      qNum.textContent = `Câu hỏi ${q.id}`;
      qText.textContent = q.text;

      optionsEl.innerHTML = "";
      q.options.forEach((opt, i) => {
        const div = document.createElement("div");
        div.className = "option";
        div.dataset.key = keys[i];
        div.innerHTML = `
          <input type="radio" name="answer" id="opt${i}" value="${keys[i]}" />
          <label class="option-label" for="opt${i}">
            <span class="option-key">${keys[i].toUpperCase()}.</span> ${opt}
          </label>
        `;
        div.addEventListener("click", () => selectOption(div, keys[i]));
        optionsEl.appendChild(div);
      });

      feedback.className = "feedback";
      feedback.textContent = "";
      btnNext.textContent = "Kiểm tra";
      btnNext.disabled = true;

      // Progress
      const pct = (currentIndex / questions.length) * 100;
      progressFill.style.width = pct + "%";
      progressText.textContent = `Câu ${currentIndex + 1} / ${questions.length}`;
      attemptInfo.textContent = `Lần thử: ${totalAttempts}`;
    }

    function selectOption(el, key) {
      if (isChecked && key !== questions[currentIndex].answer) return;

      document.querySelectorAll(".option").forEach(o => {
        if (!o.classList.contains("correct")) {
          o.classList.remove("selected", "wrong");
        }
      });

      el.classList.add("selected");
      selectedAnswer = key;
      document.getElementById(el.querySelector("input").id).checked = true;
      btnNext.disabled = false;
    }

    function checkAnswer() {
      const q = questions[currentIndex];
      totalAttempts++;
      attemptInfo.textContent = `Lần thử: ${totalAttempts}`;

      if (selectedAnswer === q.answer) {
        isChecked = true;
        document.querySelectorAll(".option").forEach(o => {
          o.classList.add("disabled");
          if (o.dataset.key === q.answer) {
            o.classList.remove("selected", "wrong");
            o.classList.add("correct");
          }
        });

        feedback.className = "feedback show correct";
        feedback.innerHTML = firstTry
          ? "✅ Chính xác! Bạn đã chọn đúng ngay lần đầu."
          : "✅ Đúng rồi! Tiếp tục nhé.";

        if (firstTry) correctFirstTry++;

        btnNext.textContent = currentIndex === questions.length - 1 ? "Xem kết quả" : "Câu tiếp theo →";
        btnNext.disabled = false;
        btnNext.onclick = nextQuestion;
      } else {
        firstTry = false;
        isChecked = true;
        document.querySelectorAll(".option").forEach(o => {
          if (o.dataset.key === selectedAnswer) {
            o.classList.remove("selected");
            o.classList.add("wrong");
          }
        });

        feedback.className = "feedback show wrong";
        feedback.innerHTML = `❌ Sai rồi! Gợi ý: ${q.hint}<br><strong>Hãy chọn lại đáp án đúng để tiếp tục.</strong>`;

        btnNext.textContent = "Chọn lại";
        btnNext.disabled = true;

        setTimeout(() => {
          isChecked = false;
          document.querySelectorAll(".option").forEach(o => {
            if (!o.classList.contains("correct")) {
              o.classList.remove("disabled", "wrong");
            }
          });
        }, 600);
      }
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex >= questions.length) {
        showResult();
      } else {
        btnNext.onclick = checkAnswer;
        loadQuestion();
      }
    }

    function showResult() {
      quizCard.classList.add("hidden");
      progressWrap.classList.add("hidden");
      resultScreen.classList.remove("hidden");

      const score = Math.round((correctFirstTry / questions.length) * 100);
      document.getElementById("finalScore").textContent = score;
      document.getElementById("statCorrect").textContent = correctFirstTry;
      document.getElementById("statTotal").textContent = questions.length;
      document.getElementById("statAttempts").textContent = totalAttempts;
    }

    function restart() {
      currentIndex = 0;
      totalAttempts = 0;
      correctFirstTry = 0;
      resultScreen.classList.add("hidden");
      quizCard.classList.remove("hidden");
      progressWrap.classList.remove("hidden");
      btnNext.onclick = checkAnswer;
      loadQuestion();
    }

    // Init
    btnNext.onclick = checkAnswer;
    document.getElementById("btnRestart").onclick = restart;
    loadQuestion();
  </script>
</body>
</html>
